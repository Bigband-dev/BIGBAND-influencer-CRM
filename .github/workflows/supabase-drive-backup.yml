name: Supabase CRM weekly encrypted Google Drive backup

on:
  workflow_dispatch:
  schedule:
    # 03:00 Sunday in South Korea (Asia/Seoul).
    - cron: '0 3 * * 0'
      timezone: 'Asia/Seoul'

permissions:
  contents: read

concurrency:
  group: supabase-crm-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_KEY_B64 }}
      BACKUP_RETENTION_COUNT: '12'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-backup.txt

      - name: Install backup dependencies
        run: python -m pip install -r scripts/requirements-backup.txt

      - name: Dump, encrypt, upload, verify, and rotate backups
        run: python scripts/backup_to_drive.py
